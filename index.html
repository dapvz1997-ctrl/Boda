<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Álbum de Recuerdos | Nuestra Boda</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      /* Verdes */
      --color-verde-profundo: #202D1C;
      --color-verde-olivo-oscuro: #34472D;
      --color-verde-olivo: #435D39;
      --color-verde-salvia: #7E9C72;

      /* Dorados */
      --color-oro: #D4AF37;
      --color-oro-cepillado: #C5A059;
      --color-champagne: #F2E5C9;

      /* Neutros */
      --color-marfil: #FAF8F5;
      --color-blanco: #FFFFFF;
      --color-borde: #DCD7CE;
      --color-texto: #666666;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--color-marfil);
      color: var(--color-texto);
      font-family: 'Montserrat', sans-serif;
      padding: 35px 16px;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
    }

    .monogram {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      letter-spacing: 5px;
      color: var(--color-oro-cepillado);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 40px;
      font-weight: 400;
      font-style: italic;
      color: var(--color-verde-profundo);
      margin-bottom: 12px;
    }

    .description {
      font-size: 14px;
      line-height: 1.8;
      color: var(--color-texto);
      max-width: 560px;
      margin: 0 auto 30px;
      font-weight: 300;
    }

    .tabs {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 35px;
    }

    .btn-tab {
      background: var(--color-blanco);
      border: 1px solid var(--color-verde-salvia);
      color: var(--color-verde-olivo);
      padding: 11px 24px;
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.25s ease;
      font-family: 'Montserrat', sans-serif;
      font-weight: 500;
    }

    .btn-tab.active, .btn-tab:hover {
      background: var(--color-verde-olivo);
      border-color: var(--color-verde-olivo);
      color: var(--color-blanco);
    }

    .panel {
      display: none;
    }

    .panel.active {
      display: block;
    }

    /* Caja de subida */
    .upload-box {
      background: var(--color-blanco);
      border: 1px solid var(--color-borde);
      border-radius: 14px;
      padding: 40px 20px;
      box-shadow: 0 8px 24px rgba(32, 45, 28, 0.04);
    }

    .upload-box h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      font-weight: 400;
      color: var(--color-verde-olivo-oscuro);
      margin-bottom: 8px;
    }

    .upload-box p {
      font-size: 13px;
      color: var(--color-texto);
      margin-bottom: 25px;
    }

    .file-input-wrapper {
      margin-bottom: 25px;
    }

    input[type="file"] {
      display: none;
    }

    .custom-file-btn {
      display: inline-block;
      padding: 13px 28px;
      background: var(--color-champagne);
      border: 1px dashed var(--color-oro-cepillado);
      border-radius: 8px;
      cursor: pointer;
      color: var(--color-verde-profundo);
      font-size: 13px;
      font-weight: 500;
      transition: opacity 0.2s;
    }

    .custom-file-btn:hover {
      opacity: 0.9;
    }

    .btn-submit {
      display: block;
      margin: 0 auto;
      background: var(--color-verde-olivo-oscuro);
      color: var(--color-blanco);
      border: none;
      padding: 13px 36px;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-radius: 30px;
      cursor: pointer;
      font-family: 'Montserrat', sans-serif;
      font-weight: 500;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background: var(--color-verde-profundo);
    }

    .btn-submit:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    #status {
      margin-top: 20px;
      font-size: 13px;
      color: var(--color-verde-olivo);
      font-weight: 500;
    }

    /* Galería */
    #gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 14px;
      margin-top: 20px;
    }

    .media-card {
      background: var(--color-blanco);
      border: 1px solid var(--color-borde);
      border-radius: 10px;
      overflow: hidden;
      aspect-ratio: 1;
      position: relative;
      box-shadow: 0 4px 12px rgba(32, 45, 28, 0.05);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .media-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 18px rgba(32, 45, 28, 0.12);
    }

    .media-card img, .media-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none; /* Permite que el click sea sobre la tarjeta */
    }

    .video-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: var(--color-verde-profundo);
      color: var(--color-champagne);
      font-size: 10px;
      font-weight: 600;
      padding: 3px 7px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }

    /* VISOR MODAL / LIGHTBOX */
    .lightbox {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(32, 45, 28, 0.94); /* Fondo translúcido en Verde Profundo */
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      touch-action: pan-y;
      user-select: none;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox-content {
      max-width: 90vw;
      max-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease-out;
    }

    .lightbox-content img, .lightbox-content video {
      max-width: 90vw;
      max-height: 80vh;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      object-fit: contain;
    }

    .lightbox-btn {
      position: absolute;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: var(--color-champagne);
      font-size: 24px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s;
      z-index: 10001;
    }

    .lightbox-btn:hover {
      background: var(--color-verde-olivo);
      color: #fff;
    }

    .lightbox-close {
      top: 20px;
      right: 20px;
      font-size: 20px;
    }

    .lightbox-prev {
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
    }

    .lightbox-next {
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
    }

    .lightbox-counter {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      color: var(--color-champagne);
      font-size: 13px;
      letter-spacing: 2px;
      font-weight: 400;
    }

    @media (max-width: 600px) {
      .lightbox-btn {
        width: 40px;
        height: 40px;
        font-size: 18px;
      }
      .lightbox-prev { left: 8px; }
      .lightbox-next { right: 8px; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="monogram">H & D</div>
  <h1>Nuestra Boda</h1>
  <p class="description">
    Queremos conservar cada recuerdo de este día tan especial. Comparte aquí tus fotos y videos favoritos para disfrutarlos juntos.
  </p>

  <div class="tabs">
    <button class="btn-tab active" onclick="showPanel(event, 'upload')">Subir Recuerdos</button>
    <button class="btn-tab" onclick="showPanel(event, 'gallery')">Ver Galería</button>
  </div>

  <!-- Panel de Subida -->
  <section id="upload" class="panel active">
    <div class="upload-box">
      <h2>Inmortaliza un Momento</h2>
      <p>Selecciona tus fotos y videos (máximo 25 MB por archivo).</p>
      
      <div class="file-input-wrapper">
        <label for="files" class="custom-file-btn" id="file-label">
          Seleccionar fotos o videos
        </label>
        <input 
          type="file" 
          id="files" 
          accept="image/*,video/mp4,video/quicktime,video/webm" 
          multiple
          onchange="updateFileLabel()"
        >
      </div>

      <button id="send" class="btn-submit" onclick="uploadFiles()">Compartir Archivos</button>
      <div id="status"></div>
    </div>
  </section>

  <!-- Panel de Galería -->
  <section id="gallery" class="panel">
    <p id="gallery-status" style="grid-column: 1/-1; color: var(--color-texto); font-size: 14px;">Cargando recuerdos...</p>
  </section>
</div>

<!-- Modal Visor / Lightbox con soporte táctil Swipe -->
<div id="lightbox" class="lightbox">
  <button class="lightbox-btn lightbox-close" onclick="closeLightbox()">✕</button>
  <button class="lightbox-btn lightbox-prev" onclick="prevMedia()">❮</button>
  
  <div class="lightbox-content" id="lightbox-container">
    <!-- El elemento img o video se renderiza dinámicamente -->
  </div>
  
  <button class="lightbox-btn lightbox-next" onclick="nextMedia()">❯</button>
  <div class="lightbox-counter" id="lightbox-counter">1 / 1</div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzoqBoiDnhmqaOFYdUmZQnR4t4z2atIrI1s2OHtf7i_nEqn1_ZLLCVGTosVx98oS7g/exec";

  let loadedMedia = [];
  let currentIndex = 0;

  function showPanel(evt, name) {
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
    document.querySelectorAll(".btn-tab").forEach(b => b.classList.remove("active"));
    
    document.getElementById(name).classList.add("active");
    if (evt && evt.currentTarget) {
      evt.currentTarget.classList.add("active");
    }

    if (name === "gallery") loadGallery();
  }

  function updateFileLabel() {
    const input = document.getElementById("files");
    const label = document.getElementById("file-label");
    if (input.files.length === 1) {
      label.textContent = input.files[0].name;
    } else if (input.files.length > 1) {
      label.textContent = `${input.files.length} archivos seleccionados`;
    } else {
      label.textContent = "Seleccionar fotos o videos";
    }
  }

  function uploadFiles() {
    const input = document.getElementById("files");
    const button = document.getElementById("send");
    const status = document.getElementById("status");
    const files = Array.from(input.files);

    if (!files.length) {
      status.textContent = "Por favor selecciona al menos un archivo.";
      return;
    }

    button.disabled = true;
    let index = 0;

    function processNext() {
      if (index >= files.length) {
        status.textContent = "¡Todos los archivos se han subido con éxito!";
        button.disabled = false;
        input.value = "";
        updateFileLabel();
        return;
      }

      const file = files[index];
      if (file.size > 25 * 1024 * 1024) {
        status.textContent = `"${file.name}" supera los 25 MB y fue omitido.`;
        index++;
        processNext();
        return;
      }

      status.textContent = `Subiendo archivo ${index + 1} de ${files.length}...`;

      const reader = new FileReader();
      reader.onload = function(e) {
        const base64 = e.target.result.split(",")[1];
        const payload = {
          name: file.name,
          mimeType: file.type || "application/octet-stream",
          base64: base64
        };

        fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
          index++;
          processNext();
        })
        .catch(err => {
          index++;
          processNext();
        });
      };

      reader.onerror = function() {
        status.textContent = `Error al leer ${file.name}`;
        button.disabled = false;
      };

      reader.readAsDataURL(file);
    }

    processNext();
  }

  function loadGallery() {
    const gallery = document.getElementById("gallery");
    gallery.innerHTML = '<p style="grid-column: 1/-1; color: var(--color-texto); font-size: 14px;">Cargando recuerdos...</p>';

    fetch(SCRIPT_URL)
      .then(res => res.json())
      .then(items => {
        gallery.innerHTML = "";
        loadedMedia = items || [];

        if (!loadedMedia.length) {
          gallery.innerHTML = '<p style="grid-column: 1/-1; color: var(--color-texto); font-size: 14px;">Aún no hay fotos ni videos. ¡Sé el primero en compartir!</p>';
          return;
        }

        loadedMedia.forEach((item, idx) => {
          const card = document.createElement("div");
          card.className = "media-card";
          card.onclick = () => openLightbox(idx);

          if (item.type === "video") {
            const video = document.createElement("video");
            video.src = item.url;
            video.preload = "metadata";
            
            const badge = document.createElement("span");
            badge.className = "video-badge";
            badge.textContent = "VIDEO";

            card.appendChild(video);
            card.appendChild(badge);
          } else {
            const img = document.createElement("img");
            img.src = item.url;
            img.alt = "Recuerdo de boda";
            img.loading = "lazy";
            card.appendChild(img);
          }

          gallery.appendChild(card);
        });
      })
      .catch(err => {
        gallery.innerHTML = '<p style="grid-column: 1/-1; color: var(--color-texto); font-size: 14px;">No se pudo actualizar la galería en este momento.</p>';
      });
  }

  /* FUNCIONES DEL VISOR MODAL (LIGHTBOX) */
  function openLightbox(index) {
    currentIndex = index;
    updateLightboxMedia();
    document.getElementById("lightbox").classList.add("active");
    document.body.style.overflow = "hidden"; // Deshabilita el scroll de fondo
  }

  function closeLightbox() {
    const lightbox = document.getElementById("lightbox");
    lightbox.classList.remove("active");
    document.body.style.overflow = ""; // Restablece el scroll
    const container = document.getElementById("lightbox-container");
    container.innerHTML = ""; // Detiene reproducción de video
  }

  function updateLightboxMedia() {
    const container = document.getElementById("lightbox-container");
    const counter = document.getElementById("lightbox-counter");
    container.innerHTML = "";

    const item = loadedMedia[currentIndex];
    counter.textContent = `${currentIndex + 1} / ${loadedMedia.length}`;

    if (item.type === "video") {
      const video = document.createElement("video");
      video.src = item.url;
      video.controls = true;
      video.autoplay = true;
      video.playsInline = true;
      container.appendChild(video);
    } else {
      const img = document.createElement("img");
      img.src = item.url;
      img.alt = "Fotografía ampliada";
      container.appendChild(img);
    }
  }

  function nextMedia() {
    if (!loadedMedia.length) return;
    currentIndex = (currentIndex + 1) % loadedMedia.length;
    updateLightboxMedia();
  }

  function prevMedia() {
    if (!loadedMedia.length) return;
    currentIndex = (currentIndex - 1 + loadedMedia.length) % loadedMedia.length;
    updateLightboxMedia();
  }

  /* GESTOS TÁCTILES (SWIPE EN CELULAR) */
  let touchStartX = 0;
  let touchEndX = 0;
  let touchStartY = 0;
  let touchEndY = 0;

  const lightbox = document.getElementById("lightbox");

  lightbox.addEventListener("touchstart", function(e) {
    touchStartX = e.changedTouches[0].screenX;
    touchStartY = e.changedTouches[0].screenY;
  }, { passive: true });

  lightbox.addEventListener("touchend", function(e) {
    touchEndX = e.changedTouches[0].screenX;
    touchEndY = e.changedTouches[0].screenY;
    handleGesture();
  }, { passive: true });

  function handleGesture() {
    const deltaX = touchEndX - touchStartX;
    const deltaY = touchEndY - touchStartY;

    // Solo reacciona si el movimiento horizontal supera los 45px y es mayor al movimiento vertical
    if (Math.abs(deltaX) > 45 && Math.abs(deltaX) > Math.abs(deltaY)) {
      if (deltaX < 0) {
        nextMedia(); // Deslizar hacia la izquierda -> Siguiente foto
      } else {
        prevMedia(); // Deslizar hacia la derecha -> Foto anterior
      }
    }
  }

  /* NAVEGACIÓN POR TECLADO EN LAPTOP */
  window.addEventListener("keydown", function(e) {
    if (!document.getElementById("lightbox").classList.contains("active")) return;
    if (e.key === "ArrowRight") nextMedia();
    if (e.key === "ArrowLeft") prevMedia();
    if (e.key === "Escape") closeLightbox();
  });
</script>

</body>
</html>
